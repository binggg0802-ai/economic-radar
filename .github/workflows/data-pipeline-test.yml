name: data-pipeline-test (TAIEX)

# 測試階段：只在 pipeline-test 分支推送時執行，輸出寫回本分支的 data/。
# 不碰 gh-pages（正式網站）。schedule 只會在預設分支生效，正式啟用前需另行設定（見 docs/ARCHITECTURE.md）。
on:
  push:
    branches: [pipeline-test]
    paths-ignore: ['data/**']
  workflow_dispatch:
    inputs:
      fault:
        description: '故障演練（留空＝正常）：bad_host / http_500 / format_change / old_data'
        required: false
        default: ''
      force:
        description: '1＝略過排程判斷強制抓取；0＝照排程判斷（可驗證重複執行會被略過）'
        required: false
        default: '0'
  schedule:
    # 只有在預設分支才會生效（目前預設分支是 gh-pages，所以這裡尚未啟動）。
    # 台北時間週一～五 14:07–17:47 每 20 分鐘檢查；是否真的連線由 pipeline/lib/schedule.mjs 依交易日曆決定，
    # 取得當日收盤即停止，不假設固定時間已公布。週末每天 15:17 一次，處理補行交易日與對帳。
    - cron: '7,27,47 6-9 * * 1-5'
    - cron: '17 7 * * 0,6'

concurrency:
  group: data-pipeline-taiex
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  taiex:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unit tests (fixtures, no network)
        run: npm test
      - name: Runner info
        run: |
          echo "runner_utc=$(date -u +%FT%TZ)"
          echo "runner_taipei=$(TZ=Asia/Taipei date +%FT%T)"
          node -v
      - name: Decide run mode
        id: mode
        shell: bash
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
          IN_FAULT: ${{ github.event.inputs.fault }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          FAULT=""; FORCE="0"
          case "${{ github.event_name }}" in
            push)
              FAULT=$(printf '%s' "$HEAD_MSG" | grep -oE '\[fault:[a-z_0-9]+\]' | head -1 | sed -E 's/\[fault:(.*)\]/\1/' || true)
              if printf '%s' "$HEAD_MSG" | grep -q '\[schedule-mode\]'; then FORCE="0"; else FORCE="1"; fi ;;
            workflow_dispatch) FAULT="$IN_FAULT"; FORCE="${IN_FORCE:-0}" ;;
            schedule) FAULT=""; FORCE="0" ;;
          esac
          echo "fault=$FAULT" >> "$GITHUB_OUTPUT"; echo "force=$FORCE" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} fault=${FAULT:-none} force=$FORCE"
      - name: Fetch → validate → store (TAIEX)
        id: run
        shell: bash
        env:
          FAULT_INJECT: ${{ steps.mode.outputs.fault }}
          FORCE_RUN: ${{ steps.mode.outputs.force }}
        run: |
          set -o pipefail
          node pipeline/run.mjs | tee run-output.json
        continue-on-error: true
      - name: Summary
        if: always()
        run: |
          echo '### TAIEX pipeline' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat run-output.json >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Commit data (status is recorded even when the source failed)
        if: always()
        run: |
          git config user.name "economic-radar-bot"
          git config user.email "economic-radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data change"; exit 0; fi
          RESULT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('run-output.json','utf8')).result)" || echo unknown)
          git commit -m "data(tw_taiex): ${RESULT} $(TZ=Asia/Taipei date +%FT%T) [${{ github.event_name }}${{ steps.mode.outputs.fault && format(' fault:{0}', steps.mode.outputs.fault) || '' }}]"
          git pull --rebase origin pipeline-test || true
          git push origin HEAD:pipeline-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taiex-run-${{ github.run_id }}
          path: |
            data/
            run-output.json
          retention-days: 30
      - name: Fail the job if the pipeline reported error/no_data
        if: steps.run.outcome == 'failure'
        run: exit 1
